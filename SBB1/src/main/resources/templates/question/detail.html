<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/layout}">

<th:block layout:fragment="css">
    <style>
        .fieldError {
            color: #b02a37;
        }
    </style>
</th:block>

<div layout:fragment="content" class="container my-3">
    <!-- 질문 Card -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${question.subject}">제목</h4>
        </div>
        <div class="card-body">
            <p class="card-text fs-5"
               style="white-space: pre-wrap;"
               th:text="${question.content}">내용</p>

            <!-- 수정 및 작성자 추가 -->
            <div class="d-flex justify-content-end">
                <!-- 질문 수정 일시-->
                <!--<div th:if="${question.updated != null}" class="badge bg-light text-dark p-2 text-start mx-3">
                    <div class="mb-2">수정일 :</div>
                    <div th:text="${#temporals.format(question.updated, 'yyyy-MM-dd HH:mm')}"></div>
                </div>-->
                <!-- 질문 작성자 -->
                <div class="badge bg-warning text-dark p-2 text-start mx-3">
                    <div class="mb-2">
                        <span th:if="${question.author != null}" th:text="${question.author.username}"></span>
                    </div>
                    <div th:text="${#temporals.format(question.created, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>

            <!-- 질문 수정 / 삭제 버튼 -->
            <div class="my-3">
                <a th:href="@{|/question/modify/${question.id}|}"
                   class="btn btn-sm btn-outline-primary"
                   sec:authorize="isAuthenticated()"
                   th:if="${question.author != null and
                  #authentication.getPrincipal().getUsername() == question.author.username}"
                   th:text="수정">수정
                </a>
                <!-- 페이지 이동없이 삭제 -->
                <a  href="javascript:void(0);"
                    th:data-uri="@{|/question/delete/${question.id}|}"
                    class="delete btn btn-sm btn-outline-danger"
                    sec:authorize="isAuthenticated()"
                    th:if="${question.author != null and #authentication.getPrincipal().getUsername() == question.author.username}"
                    th:text="삭제">삭제
                </a>
            </div>
        </div>
    </div>

    <!-- 답변 목록 -->
    <div class="mb-4">
        <h5 class="mb-3">
            답변 목록
            <span class="badge bg-primary"
                  th:text="${#lists.size(question.answerList)}">0</span>
        </h5>

        <!-- 답변이 없는 경우 -->
        <div th:if="${#lists.isEmpty(question.answerList)}"
             class="alert alert-light text-muted border">
            아직 등록된 답변이 없습니다.
        </div>

        <!-- 답변마다 개별 Card 생성 -->
        <div th:each="answer : ${question.answerList}"
             class="card shadow-sm mb-3">

            <div class="card-body">
                <p class="card-text mb-0"
                   style="white-space: pre-wrap;"
                   th:text="${answer.content}">
                    답변 내용
                </p>

                <!-- 수정일 및 작성자 정보 -->
                <div class="d-flex justify-content-end">
                    <!-- 답변 수정 일시-->
                    <!--<div th:if="${answer.updated != null}" class="badge bg-light text-dark p-2 text-start mx-3">
                        <div class="mb-2">수정일 :</div>
                        <div th:text="${#temporals.format(answer.updated, 'yyyy-MM-dd HH:mm')}"></div>
                    </div>-->

                    <!-- 답변 작성자 -->
                    <div class="badge bg-info text-dark p-2 text-start mx-3">
                        <div class="mb-2">
                            <span th:if="${answer.author != null}" th:text="${answer.author.username}"></span>
                        </div>
                        <div th:text="${#temporals.format(answer.created, 'yyyy-MM-dd HH:mm')}"></div>
                    </div>
                </div>

                <!-- 답변 수정/삭제 버튼 추가 -->
                <div class="my-3">
                    <!-- 답변 수정 버튼 -->
                    <a th:href="@{|/answer/modify/${answer.id}|}"

                       sec:authorize="isAuthenticated()"
                       th:if="${answer.author != null and #authentication.getPrincipal().getUsername() == answer.author.username}"
                       th:text="수정"></a>

                    <!-- 답변 삭제 버튼 -->
                    <a href="javascript:void(0);"
                       th:data-uri="@{|/answer/delete/${answer.id}|}"
                       class="delete btn btn-sm btn-outline-secondary"
                       sec:authorize="isAuthenticated()"
                       th:if="${answer.author != null and #authentication.getPrincipal().getUsername() == answer.author.username}"
                       th:text="삭제">
                    </a>
                </div>
            </div>

        </div>
    </div>

    <!-- 답변 작성 Card -->
    <div class="card shadow-sm">
        <div class="card-header bg-light">
            <h5 class="mb-0">답변 작성</h5>
        </div>

        <div class="card-body">
            <form th:action="@{|/answer/create/${question.id}|}"
                  th:object="${answerDto}"
                  method="post">

                <div class="mb-3">
                    <label for="content" class="form-label">
                        답변 내용
                    </label>
                    <textarea
                            sec:authorize="isAnonymous()" disabled
                            id="content"
                            name="content"
                            class="form-control"
                            rows="6"
                            placeholder="답변을 입력해주세요."
                            th:field="*{content}"                            >
                    </textarea>
                    <textarea
                            sec:authorize="isAuthenticated()"
                            id="content"
                            name="content"
                            class="form-control"
                            rows="6"
                            placeholder="답변을 입력해주세요."
                            th:field="*{content}"                            >
                    </textarea>
                    <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="fieldError">error</p>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary">
                        답변 등록
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script type="text/javascript">
        $(document).ready(function () {
            // 삭제 버튼 클릭 이벤트
            $('.delete').click(function () {
                if (confirm('정말 삭제하시겠습니까?')) {
                    const uri = $(this).data('uri');
                    window.location.href = uri;
                }
            });

        });
    </script>
</th:block>

</html>
